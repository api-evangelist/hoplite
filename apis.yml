apis:
- name: Hoplite API
  description: >-
    The Hoplite platform API at api.hoplite.sh. Documented through the developer
    docs (no public OpenAPI published as of this profiling). Surfaces include
    model-provider discovery (GET /api/model-providers), GitHub discovery (GET
    /api/github/installations, /api/github/repositories, and
    /api/github/repositories/:id/branches), thread/project management, and an
    inbound automation-webhook delivery endpoint (POST /api/automations/webhooks).
    Authenticated with an API key (Settings -> Account -> API keys) or OAuth via
    the MCP server. A /health endpoint returns service status and build version.
  humanURL: https://hoplite.sh/docs
  baseURL: https://api.hoplite.sh
