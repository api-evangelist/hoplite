aid: hoplite
name: Hoplite
description: >-
  Hoplite is a cloud coding-agent platform (Y Combinator S26). You connect a
  GitHub repository, describe a task in a thread, and an autonomous agent does
  the work inside an isolated, cloned dev environment (a "sandbox") — reading and
  editing code, running your test suite, starting your dev server, verifying
  changes in a built-in browser, and opening a pull request when it's done. Runs
  stream live into the thread with inline approvals for sensitive actions, a diff
  view, and a PR rail that tracks checks, reviews, and unresolved comments.
  Hoplite runs a lineup of OpenAI (GPT-5.6 family, GPT-5.3 Codex) and Anthropic
  (Fable 5, Opus 4.8, Sonnet 4.6, Haiku 4.5) models, bills on prepaid credits via
  Stripe, and integrates with GitHub, Slack, Linear, and customer-hosted MCP
  servers. It also exposes its own hosted MCP server and a CLI so you can drive
  Hoplite from Claude Code, Cursor, or any MCP client. Founded 2026 in San
  Francisco by Ryan Morrissey and Bence Redmond.
